name: create issue branch

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-request: write

jobs:
  create_branch:
    if: ${{ github.event.issue.pull_request == null && contains(github.event.comment.body, '/cib') }}
    runs-on: ubuntu-latest
    steps:
      - uses: robvanderleek/create-issue-branch@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
